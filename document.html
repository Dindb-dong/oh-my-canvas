<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Oh My Canvas</title></head>
<body class="document-runtime">
  <header id="topbar">
    <button id="home" title="Document library" aria-label="Document library"><img class="app-mark" src="/app-icon.png" alt=""><span class="mark">omc</span></button>
    <span class="separator"></span><button id="toggle-layers" aria-label="Toggle layers panel" aria-controls="left" aria-expanded="true" data-icon="panel"></button><button id="document-title" disabled><span id="document-name">Your canvases</span></button><form id="title-form" hidden><input id="title-input" aria-label="Canvas name" title="Enter to save, Escape to cancel" maxlength="120" required autocomplete="off" spellcheck="false"></form>
    <span id="save-state" aria-label="Local save status">Local workspace</span>
    <details id="loading-notice" hidden><summary id="loading-label" aria-live="polite">Loading pages…</summary><div class="loading-panel"><progress id="loading-progress" max="1" value="0" aria-label="Pages loaded"></progress><p id="loading-description"></p><div id="loading-pages" aria-label="Loading page list"></div><button id="stop-loading" type="button" hidden>Stop importing</button></div></details>
    <div class="bar-actions"><div id="peers" aria-label="Collaborators"></div><button id="components"><span data-icon="components" aria-hidden="true"></span>Components</button><button id="export"><span data-icon="download" aria-hidden="true"></span>Export</button><button id="mcp">MCP</button><button id="collaborate" class="primary">Collaborate <span data-icon="external" aria-hidden="true"></span></button></div>
  </header>
  <main id="workspace"><div id="editor"></div><div id="remote-cursors" aria-hidden="true"></div></main>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/document-runtime.js"></script>
</body></html>
