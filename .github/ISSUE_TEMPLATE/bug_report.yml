name: Bug report
description: Report a reproducible problem with a minimal, non-sensitive example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. English, 한국어, 日本語 and 简体中文 are welcome.
        Do not paste credentials, session invitations, tokens, mcp-runtime.json, private canvases or full user-data folders. A portable canvas contains embedded assets and history; recreate sensitive reproductions in a new synthetic document.
        For a suspected security issue, use a private channel already agreed with the maintainer rather than disclosing sensitive details here.
  - type: input
    id: version
    attributes:
      label: App version or source commit
      description: Include the commit/build you tested. If unknown, say so.
      placeholder: "0.1.0 / git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      description: Include installation method; add Node/npm versions only for source builds.
      placeholder: "macOS version, arm64; installed app or source build"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Canvas editing or layout
        - Components or variants
        - Save, reopen or import
        - Export
        - Undo or Redo
        - Local MCP
        - Collaboration or reconnect
        - Library or app interface
        - Documentation or translation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a new synthetic canvas when possible. Include exact tool arguments if relevant, without secrets.
      placeholder: |
        1. Open a new canvas.
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include whether the problem persists after save/reopen or Undo, when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic reproduction, screenshots or redacted logs
      description: Attach only the smallest safe example. Do not upload real designs, invitations, runtime token files or a user-data directory.
  - type: textarea
    id: connections
    attributes:
      label: Collaboration or MCP context, if relevant
      description: State host/guest count, same-machine/LAN/external-network test, offline/reconnect sequence, and client names. Never include addresses that must remain private, tokens or invitation strings. Do not port-forward MCP.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked this report and its attachments for private documents, credentials, invitations and runtime tokens.
          required: true
        - label: I searched existing reports available to me and included a minimal reproduction when possible.
          required: false
