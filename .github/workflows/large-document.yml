name: Large document validation

on:
  workflow_dispatch:
    inputs:
      compare_reference:
        description: Also measure the merged PR 12 runtime on this runner
        type: boolean
        default: false
  push:
    branches: [perf/large-document-core, perf/progressive-document-loading]
    paths:
      - core/**
      - editor/**
      - electron/**
      - src/**
      - document.html
      - scripts/**
      - tests/**
      - package*.json
      - .github/workflows/large-document.yml

permissions:
  contents: read

concurrency:
  group: large-document-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate and verified LFS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          lfs: true
          persist-credentials: false
      - name: Check out historical reference
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cfa052c8d08aa368017314f3ba08f50a36fd2e47
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare evidence and verify source
        run: |
          mkdir -p evidence/baseline evidence/current evidence/viewport
          python3 - <<'PY'
          import hashlib, pathlib
          source = pathlib.Path('candidate/fixtures/design-files/iOS-and-iPadOS-27.fig')
          content = source.read_bytes()
          assert len(content) == 160627671
          assert hashlib.sha256(content).hexdigest() == 'c7c4fdbe469ae451c9a3d3d384a2102fa08dfaa220a1277e2df17fc2146c5ee7'
          PY
      - name: Install candidate dependencies
        working-directory: candidate
        run: npm ci
      - name: Install native display dependencies
        working-directory: candidate
        run: npx playwright install-deps chromium
      - name: Verify candidate
        id: verify-candidate
        working-directory: candidate
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ../evidence/check.log
          node scripts/check-docs.mjs 2>&1 | tee ../evidence/docs-check.log
          npm test 2>&1 | tee ../evidence/node-tests.log
          npm run test:editor -- --maxWorkers=2 2>&1 | tee ../evidence/editor-tests.log
          npm run build 2>&1 | tee ../evidence/current-build.log
      - name: Build historical reference
        id: reference-build
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        continue-on-error: true
        working-directory: baseline
        run: |
          set -o pipefail
          npm ci
          npm run build 2>&1 | tee ../evidence/baseline-build.log
      - name: Measure candidate
        timeout-minutes: 12
        working-directory: candidate
        run: |
          xvfb-run --auto-servernum node scripts/large-document-e2e.mjs --source "$GITHUB_WORKSPACE/candidate/fixtures/design-files/iOS-and-iPadOS-27.fig" --output "$GITHUB_WORKSPACE/evidence/current" --label candidate
      - name: Compare viewport pixels and hit testing
        if: ${{ !cancelled() && steps.verify-candidate.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: candidate
        run: |
          xvfb-run --auto-servernum node scripts/viewport-motion-e2e.mjs --output "$GITHUB_WORKSPACE/evidence/viewport" --label candidate
      - name: Retain candidate evidence before reference measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: large-document-current-${{ github.run_id }}
          path: |
            evidence/current/result.json
            evidence/current/*-trace.json
            evidence/current/*.png
            evidence/viewport/result.json
            evidence/viewport/*.png
            evidence/*.log
          retention-days: 7
          if-no-files-found: error
      - name: Measure historical reference
        if: success() && steps.reference-build.outcome == 'success'
        timeout-minutes: 22
        continue-on-error: true
        working-directory: baseline
        run: |
          xvfb-run --auto-servernum node ../candidate/scripts/large-document-e2e.mjs --source "$GITHUB_WORKSPACE/candidate/fixtures/design-files/iOS-and-iPadOS-27.fig" --output "$GITHUB_WORKSPACE/evidence/baseline" --label pr12 --legacy-loading --journey-timeout 1200000
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: large-document-${{ github.run_id }}
          path: |
            evidence/**/result.json
            evidence/**/*-trace.json
            evidence/**/*.png
            evidence/*.log
          retention-days: 7
          if-no-files-found: error
