name: Native graphics
on:
  pull_request:
    paths: ['native/**', 'browser-capture/**', 'package*.json', '.github/workflows/native-graphics.yml']
permissions:
  contents: read
jobs:
  graphics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: bash native/ci/linux-libs.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml --locked -p omc-text -p omc-layout -p omc-scene -p omc-render -p omc-import -p omc-export -p omc-mcp -p omc-desktop
      - name: Native service and stdio bridge
        run: cargo build --manifest-path native/Cargo.toml --locked -p omc-service -p omc-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked SDK and browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser capture tests
        run: npx playwright install --no-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: Register Chromium executable
        run: >-
          node --input-type=module -e "import { chromium } from 'playwright';
          import { accessSync, appendFileSync } from 'node:fs';
          const chromiumPath = chromium.executablePath(); accessSync(chromiumPath);
          appendFileSync(process.env.GITHUB_ENV, 'OMC_CAPTURE_CHROME_BINARY=' + chromiumPath + '\n');"
      - name: Official MCP client contracts
        run: >-
          node --test --test-concurrency=2 native/tests/mcp.e2e.mjs
          native/tests/mcp-replica-import.e2e.mjs
          native/tests/figcraft-core.e2e.mjs
          native/tests/figcraft-branches.e2e.mjs
          native/tests/figcraft-catalog.e2e.mjs
          native/tests/figcraft-advanced.e2e.mjs
          native/tests/figcraft-design.e2e.mjs
          native/tests/figcraft-geometry.e2e.mjs
          native/tests/figcraft-text.e2e.mjs
          native/tests/figcraft-server.e2e.mjs
          native/tests/mcp.figcraft-files.e2e.mjs
          native/tests/mcp.browser-picker.e2e.mjs
          native/tests/mcp.web-capture.e2e.mjs
          native/tests/mcp.system.e2e.mjs
          native/tests/mcp.presentation.e2e.mjs
