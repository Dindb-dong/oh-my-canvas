name: Native graphics
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native-graphics.yml']
permissions:
  contents: read
jobs:
  graphics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: bash native/ci/linux-libs.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml --locked -p omc-text -p omc-layout -p omc-scene -p omc-render -p omc-import -p omc-export -p omc-mcp
      - name: Native service and stdio bridge
        run: cargo build --manifest-path native/Cargo.toml --locked -p omc-service -p omc-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Official MCP SDK test dependency
        run: npm install --prefix "${{ runner.temp }}/omc-mcp-sdk" --ignore-scripts --no-audit --no-fund "@modelcontextprotocol/sdk@1.32.2"
      - name: Official MCP client contracts
        env:
          OMC_TEST_SDK_ROOT: ${{ runner.temp }}/omc-mcp-sdk/node_modules/@modelcontextprotocol/sdk
        run: node native/tests/mcp.e2e.mjs
