[workspace]
resolver = "2"
members = ["crates/omc-assets", "crates/omc-engine", "crates/omc-export", "crates/omc-import", "crates/omc-layout", "crates/omc-model", "crates/omc-protocol", "crates/omc-render", "crates/omc-scene", "crates/omc-storage", "crates/omc-style", "crates/omc-sync", "crates/omc-text", "crates/omc-workspace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Dindb-dong/oh-my-canvas"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_jcs = "=0.2.0"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
hex = "=0.4.3"
tempfile = "=3.27.0"
skia-safe = { version = "=0.90.0", features = ["textlayout", "svg", "webp"] }
taffy = "=0.9.1"
html5ever = "=0.35.0"
markup5ever_rcdom = "=0.35.0+unofficial"
roxmltree = "=0.21.2"
svgtypes = "=0.16.2"
fs2 = "=0.4.3"
base64 = "=0.23.1"
unicode-segmentation = "1.12"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
flate2 = "=1.1.9"
zstd = "=0.13.3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

